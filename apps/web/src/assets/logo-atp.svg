<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="ATP Amateur Tennis Platform">
  <defs>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>
  <!-- Letras ATP -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="900">
    <!-- A em navy -->
    <text x="40" y="220" font-size="240" fill="#0f1e3d">A</text>
    <!-- T em verde-limão -->
    <text x="190" y="220" font-size="240" fill="#84cc16">T</text>
    <!-- P em navy (com bola na contra-forma) -->
    <text x="320" y="220" font-size="240" fill="#0f1e3d">P</text>
  </g>
  <!-- Bola de tênis dentro do P -->
  <g transform="translate(370,86)">
    <circle r="36" fill="url(#ballGrad)" stroke="#3f6212" stroke-width="2"/>
    <path d="M -32 -10 Q 0 4 32 -10" stroke="#fff" stroke-width="2.5" fill="none"/>
    <path d="M -32 14 Q 0 28 32 14" stroke="#fff" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Court silhouette sob o A -->
  <g transform="translate(58,232)">
    <path d="M 0 0 L 132 0 L 110 36 L 22 36 Z" fill="#0f1e3d"/>
    <line x1="22" y1="18" x2="110" y2="18" stroke="#84cc16" stroke-width="2.5"/>
    <line x1="66" y1="0" x2="66" y2="36" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Tagline -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="240" y="320" font-size="40" font-weight="800" letter-spacing="6" fill="#0f1e3d">AMATEUR</text>
    <text x="240" y="368" font-size="56" font-weight="900" letter-spacing="4" fill="#84cc16">TENNIS</text>
    <text x="240" y="412" font-size="36" font-weight="800" letter-spacing="8" fill="#0f1e3d">PLATFORM</text>
    <line x1="80" y1="442" x2="180" y2="442" stroke="#84cc16" stroke-width="3"/>
    <line x1="300" y1="442" x2="400" y2="442" stroke="#84cc16" stroke-width="3"/>
    <text x="240" y="452" font-size="16" font-weight="700" letter-spacing="3" fill="#0f1e3d">TORNEIOS • LIGAS • RANKING</text>
  </g>
</svg>
